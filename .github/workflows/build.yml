# Builds the FM-1 firmware package (.fwsc) with JieLi's toolchain and checks the host tests.
# Push or pull request: both jobs run, the package is kept as a download (Actions tab, the run, "Artifacts").
# A tag v*: the release is built and signed by release.yml (the Firmware Hub's shared workflow), not here.
# Run by hand (Actions, build, Run workflow): also the SMK-37 package in Joakim Eriksson's emulator (fm1-emu) with
# tools/emu/smk37.script; its screens and the pads' colours are the artifact smk37-emu.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host tests and web emulator
    runs-on: ubuntu-24.04            # (ubuntu-latest is 26.04 now, whose package mirror hung)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python3 -m pip install Pillow
          # the runner image has clang and often lld already: apt only when one is missing (its package mirror has been down)
          WASMLD="$(command -v wasm-ld || ls /usr/lib/llvm-*/bin/wasm-ld 2>/dev/null | sort -V | tail -1 || true)"
          if command -v clang >/dev/null && [ -n "$WASMLD" ]; then
            echo "clang and wasm-ld are there: $WASMLD"
            case "$WASMLD" in /usr/lib/llvm-*) echo "$(dirname "$WASMLD")" >> "$GITHUB_PATH";; esac
          else
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
            sudo apt-get $APT update
            sudo apt-get $APT install -y clang lld
          fi
      - name: Firmware engine on this computer (WAV and screen PNGs)
        run: tests/run_host.sh
      - name: The SMK-37 build on this computer (pads, faders, wheels; the pads under the screen)
        run: BOARD=smk37 tests/run_host.sh tests/scripts/smk37.txt
      - name: Two halves of the wheels equal all of them (the second core's split)
        run: |
          cp build/host/dinghy.wav build/host/two.wav
          ORGAN_ONE=1 build/host/dinghy build/host/one > /dev/null
          cmp build/host/one.wav build/host/two.wav
      - name: Programs and MIDI controllers (setBfree's defaults)
        run: |
          mkdir -p build
          cc -O1 -Wall -Wno-unused-function -Wno-unused-variable -Ifirmware/src -Itests -o build/organ_test tests/organ_test.c -lm
          build/organ_test
      - name: TRS MIDI IN parser
        run: |
          mkdir -p build
          cc -O1 -Wall -Wno-unused-function -Wno-unused-variable -Ifirmware/src -Ifirmware/hal \
             -o build/midi_uart_test tests/midi_uart_test.c
          build/midi_uart_test
      - name: The update loader's screen (logo, progress)
        run: |
          mkdir -p build
          cc -O1 -Wall -Wno-unused-function -Ifirmware/src -o build/ldr_screen tests/ldr_screen_host.c
          build/ldr_screen build/ldr
      - name: Web emulator (WebAssembly)
        run: web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: host-output
          path: |
            build/host/*.wav
            build/host/*.png
            web/index.html
          if-no-files-found: warn

  firmware:
    name: FM-1 and SMK-37 packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # (main too: the FM-1 build is compared with it)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install Pillow
      - name: Cache toolchain and SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-AC79NN_SDK_V1.2.1_2023-12-13-v1
      - name: Get JieLi toolchain and SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/get_toolchain.sh
          test -x "$HOME/.jieli/toolchain/pi32v2/bin/clang" || { echo "::error::toolchain download did not give pi32v2/bin/clang"; exit 1; }
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Build
        run: |
          ./build.sh --board smk37
          ./build.sh --board smk37 --model elite
          ./build.sh --board smk37 --model mke
          ./build.sh                 # the FM-1 last: build/dinghy.bin is its app
          ls -l build/*.fwsc
        shell: bash
      - name: "Is the FM-1 app byte for byte main's? (a warning if not; a branch that only touches the SMK-37 must not change it)"
        if: github.ref != 'refs/heads/main'
        run: |
          ./build.sh --release 9.9 > /dev/null && cp build/dinghy.bin /tmp/branch.bin && cp build/loader/ota.bin /tmp/branch-ota.bin
          git worktree add /tmp/main origin/main
          (cd /tmp/main && ./build.sh --release 9.9 > /dev/null)
          same=1
          cmp /tmp/main/build/dinghy.bin /tmp/branch.bin || same=0
          cmp /tmp/main/build/loader/ota.bin /tmp/branch-ota.bin || same=0
          ./build.sh > /dev/null     # (the dev build again for the artifact)
          if [ $same = 1 ]; then echo "FM-1 app and loader: the same as main"
          else echo "::warning::The FM-1 app or loader differs from main's: right if this branch changes the FM-1, wrong if it should not"; fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.fwsc
            build/dinghy.dis

  smk37-emu:
    name: SMK-37 in the emulator (by hand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install Pillow
      - name: Cache toolchain and SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-AC79NN_SDK_V1.2.1_2023-12-13-v1
      - name: Get JieLi toolchain and SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tools/get_toolchain.sh
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Build the SMK-37 package
        run: ./build.sh --board smk37
      - name: Build the emulator (its batch runner, with fm1-soc's script for the analog inputs)
        run: |
          git clone https://github.com/joakimeriksson/fm1-emu.git /tmp/emu
          git -C /tmp/emu checkout 736aded
          git -C /tmp/emu apply "$PWD/tools/emu/fm1-emu-script.patch"
          (cd /tmp/emu && cargo build --release -p fm1-emu)
      - name: Run it
        run: |
          PKG=$(ls build/b3organ-smk37*.fwsc | head -1)
          SCRIPT=$(grep -v '^#' tools/emu/smk37.script | tr -d ' \n')
          mkdir -p /tmp/emu/work && cd /tmp/emu
          FM1_SCRIPT="$SCRIPT" ./target/release/fm1-emu --fwsc "$GITHUB_WORKSPACE/$PKG" --ms 5200 --snap 2600,3500,5100 --quiet | tail -20
      - name: The pictures (and in the log, as base64 PNG)
        run: |
          mkdir -p build/emu
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for b in sorted(glob.glob("/tmp/emu/work/lcd_*.bmp")):
              t = b.split("_")[-1][:-4]
              im = Image.open(b).convert("RGB")
              pads = open(f"/tmp/emu/work/pads_{t}.txt").read().split("\n")
              cols = pads[0].split()
              out = Image.new("RGB", (240, 300), (24, 24, 24))
              out.paste(im, (0, 0))
              for i, c in enumerate(cols):
                  v = int(c, 16); rgb = (v >> 16 & 255, v >> 8 & 255, v & 255)
                  x0, y0 = (i % 8) * 30 + 3, 246 + (i // 8) * 26
                  for x in range(x0, x0 + 24):
                      for y in range(y0, y0 + 22):
                          out.putpixel((x, y), rgb)
              p = f"build/emu/smk37-{t}.png"
              out.save(p)
              buf = io.BytesIO(); out.save(buf, "PNG")
              print(f"PNG {t} {base64.b64encode(buf.getvalue()).decode()}")
              print(f"PADS {t} {pads[0]} LEDS {pads[1]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smk37-emu
          path: build/emu/*.png
